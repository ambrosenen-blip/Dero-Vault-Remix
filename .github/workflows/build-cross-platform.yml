name: Cross-Platform Desktop Builds

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Release Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run TypeScript type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Package Windows desktop application
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifacts exist
        shell: bash
        run: |
          echo "Inspecting Windows release artifacts..."
          ls -la release/
          if [ ! -f "release/DeroVault-Setup.exe" ] && [ ! -f "release/Dero Vault-1.0.0-win.zip" ]; then
            echo "Error: Required Windows release artifacts not found!"
            exit 1
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeroVault-Windows-Installer-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS (Apple Silicon & Intel) Build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run TypeScript type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Package macOS application
        run: npm run package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeroVault-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 30

  build-linux:
    name: Linux (AppImage & deb) Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run TypeScript type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Package Linux desktop application
        run: npm run package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeroVault-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    name: Publish GitHub Release (Direct Downloads)
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare release assets directory
        run: |
          mkdir -p final-assets
          find downloaded-artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Dero Vault v1.0.0 — Official Desktop Release' }}
          draft: false
          prerelease: false
          files: final-assets/*
          body: |
            ## Dero Vault — Your Digital Granary
            
            ### Direct Software Downloads:
            - **Windows 10/11 Installer**: [`DeroVault-Setup.exe`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}/DeroVault-Setup.exe) (Recommended: 1-click install)
            - **Windows Portable (.zip)**: [`DeroVault-Windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}/DeroVault-Windows-x64.zip)
            - **macOS Installer (.dmg)**: Available under Assets below
            - **Linux (.AppImage / .deb)**: Available under Assets below

            ### Core Features:
            - Simple, local-first automatic backup application.
            - Plug in your registered USB drive, and your office files are backed up quietly.
            - 100% offline, private, zero telemetry.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
